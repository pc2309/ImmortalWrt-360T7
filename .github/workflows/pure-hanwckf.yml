name: Build ImmortalWrt Master 360T7 108M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Initialization environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential flex bison git wget curl rsync libssl-dev python3 python3-pip python3-distutils unzip libncurses5-dev zlib1g-dev libelf-dev libudev-dev libdw-dev

      - name: Clone ImmortalWrt Source master
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git checkout master

      - name: Add iStore feeds
        run: |
          cd openwrt
          echo "src-git istore https://github.com/istoreos/istore-packages.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config【108M大分区｜512M内存｜MT闭源29dBm】
        run: |
          cd openwrt
          make defconfig
          sed -i 's/CONFIG_TARGET_mediatek_mt7981=n/CONFIG_TARGET_mediatek_mt7981=y/' .config
          sed -i 's/CONFIG_TARGET_mediatek_mt7981_DEVICE_360_t7=n/CONFIG_TARGET_mediatek_mt7981_DEVICE_360_t7=y/' .config
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=100/' .config
          sed -i 's/CONFIG_TARGET_UBOOT_SPL_SIZE=.*/CONFIG_TARGET_UBOOT_SPL_SIZE=2M/' .config
          sed -i 's/CONFIG_PACKAGE_kmod-mt7981-open=n/CONFIG_PACKAGE_kmod-mt7981-open=n/' .config
          sed -i 's/CONFIG_PACKAGE_kmod-mt7981-closed=n/CONFIG_PACKAGE_kmod-mt7981-closed=y/' .config
          sed -i 's/CONFIG_MT7981_TX_POWER_24DBM=y/CONFIG_MT7981_TX_POWER_24DBM=n/' .config
          sed -i 's/CONFIG_MT7981_TX_POWER_29DBM=n/CONFIG_MT7981_TX_POWER_29DBM=y/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-openclash=n/CONFIG_PACKAGE_luci-app-openclash=y/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-istorex=n/CONFIG_PACKAGE_luci-app-istorex=y/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-sqm=n/CONFIG_PACKAGE_luci-app-sqm=y/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-tailscale=n/CONFIG_PACKAGE_luci-app-tailscale=y/' .config
          make defconfig

      - name: Download All Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Start Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload 108M Factory.bin
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-512M-108M-29dBm-FactoryBin
          path: openwrt/bin/targets/mediatek/mt7981/*squashfs-factory.bin
