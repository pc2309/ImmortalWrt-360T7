name: Build 360T7 hanwckf Custom
on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build'
        required: false
        default: false
        type: boolean
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
      REPO_BRANCH: openwrt-24.10
      FEEDS_CONF: feeds.conf.default
      CONFIG_FILE: .config
      DIY_P1_SH: diy-part1.sh
      DIY_P2_SH: diy-part2.sh
      UPLOAD_BIN_DIR: false
      UPLOAD_FIRMWARE: true
      UPLOAD_RELEASE: true
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --branch $REPO_BRANCH $REPO_URL immortalwrt
          cd immortalwrt
          git checkout $REPO_BRANCH
      - name: Add iStore feeds
        run: |
          cd immortalwrt
          echo "src-git istore https://github.com/istoreos/istoreos-feeds.git;istore" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Patch 512M memory support
        run: |
          cd immortalwrt
          if [ -f target/linux/mediatek/dts/mt7981/qihoo_360t7.dts ]; then
            sed -i 's/reg = <0x40000000 0x10000000>/reg = <0x40000000 0x20000000>/' target/linux/mediatek/dts/mt7981/qihoo_360t7.dts
            echo "512M DTS patch applied"
          fi
      - name: Load config and add custom packages
        run: |
          cd immortalwrt
          if [ -f ../6.6_pure.config ]; then
            cp ../6.6_pure.config .config
          fi
          echo "CONFIG_PACKAGE_luci-app-mtwifi-cfg=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-turboacc-mtk=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-istore=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-istore-quickstart=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_mt_wifi=y" >> .config
          echo "CONFIG_PACKAGE_mt_wifi-firmware=y" >> .config
      - name: Download packages
        run: |
          cd immortalwrt
          make defconfig
          make download -j$(nproc)
      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s
      - name: Upload firmware
        uses: actions/upload-artifact@main
        with:
          name: 360T7-hanwckf-custom
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*.bin
            immortalwrt/bin/targets/mediatek/filogic/*.sha256sums
