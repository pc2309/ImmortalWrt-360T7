name: Build ImmortalWrt 360T7 MT7981
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies Ubuntu22.04
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip libssl-dev python3 python3-pip
          sudo apt -y autoremove
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-360T7-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-360T7-

      - name: Config ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          ccache -M 10G
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write config by echo
        run: |
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_360T7=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fullconenat=y" >> .config
          make defconfig

      - name: Compile firmware
        run: |
          make -j$(nproc) || exit 1

      - name: List all bin files
        run: |
          ls -R .

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-firmware
          path: "**/*.bin"
